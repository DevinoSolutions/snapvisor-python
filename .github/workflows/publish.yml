name: Publish

# Releases go out through PyPI Trusted Publishing (OIDC) — no API token or
# password lives in this repo. The trusted publisher is registered on PyPI as
# owner DevinoSolutions / repo snapvisor-python / workflow publish.yml /
# environment pypi, and has published successfully since 0.1.0.
#
# Two ways in, both gated:
#   * push a `v<version>` tag — the normal path, and the only one that leaves
#     provenance tying the PyPI artifact to a commit;
#   * workflow_dispatch — for re-running a failed publish of an existing tag.
#
# Nothing ships until `verify` (version sanity) and `ci` (the full suite on this
# exact SHA) are both green.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read the package version
        id: version
        run: |
          version="$(python -c 'import re,pathlib; print(re.search(r"__version__ = \"([^\"]+)\"", pathlib.Path("src/snapvisor/__init__.py").read_text()).group(1))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"
      - name: Assert the tag matches __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match snapvisor.__version__ ($version)."
            exit 1
          fi
          echo "Tag v$tag matches __version__."
      - name: Assert the version is not already on PyPI
        run: |
          version="${{ steps.version.outputs.version }}"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/snapvisor/$version/json")"
          if [ "$status" = "200" ]; then
            echo "::error::snapvisor $version is already on PyPI. Bump __version__ and tag again."
            exit 1
          fi
          echo "snapvisor $version is not on PyPI yet (HTTP $status)."

  ci:
    # No untested SHA ships: this runs the full lint/type/unit/spec-drift/e2e
    # suite against the commit being published, not against whatever last ran
    # on main.
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [verify, ci]
    environment: pypi
    permissions:
      id-token: write # required for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
