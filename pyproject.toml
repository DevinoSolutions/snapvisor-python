[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snapvisor"
dynamic = ["version"]
description = "Official Python SDK and CLI for the Snapvisor visual regression testing platform."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Devino Solutions Inc.", email = "support@snapvisor.io" }]
keywords = [
  "snapvisor",
  "visual-regression",
  "visual-testing",
  "screenshot",
  "argos",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "attrs>=22.2.0"]

[project.urls]
Homepage = "https://snapvisor.io"
Documentation = "https://snapvisor.io/docs"
Repository = "https://github.com/DevinoSolutions/snapvisor-python"
Issues = "https://github.com/DevinoSolutions/snapvisor-python/issues"

[project.scripts]
snapvisor = "snapvisor.cli:main"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.16.0",
  "ty==0.0.63",
  "pillow==12.3.0",
]
# Only needed to regenerate `snapvisor._generated` (scripts/regen.py); kept out
# of `dev` so the test matrix does not carry the generator's dependency tree.
codegen = [
  "openapi-python-client==0.29.0",
  "PyYAML>=6,<7",
]

[tool.hatch.version]
path = "src/snapvisor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/snapvisor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
# `_generated` is machine-written by scripts/regen.py and reformatted with this
# repo's ruff config on every regeneration. It is still linted — these four rules
# are the only ones the generator's output structurally cannot satisfy:
# intra-package relative imports (TID252), long `.format()` URL templates (E501),
# and its explicit if/else unpacking style (SIM101/SIM108).
"src/snapvisor/_generated/**" = ["TID252", "E501", "SIM101", "SIM108"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src"]

# `_generated` is fully type-checked except for one ty false positive: the
# generator narrows a `dict` out of an untyped payload and hands it to a
# `Mapping[str, Any]` parameter, which ty reports as `Top[dict[Unknown, Unknown]]`.
# Scoped to the generated tree only — handwritten code gets the full rule set.
[[tool.ty.overrides]]
include = ["src/snapvisor/_generated/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
